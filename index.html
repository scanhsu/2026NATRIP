<style>
:root{
  --bg:#EFF4F2; --card:#FFFFFF; --card2:#F7FAF9; --ink:#1B2E29; --mut:#5E736D;
  --line:#D9E3DF; --acc:#177E74; --acc-soft:#DCEEEB; --acc-ink:#0E5A52;
  --amber:#B96F1E; --amber-soft:#F6E8D5; --red:#C24438; --red-soft:#F7E3E0;
  --green:#2E7D4F; --green-soft:#DFEEE4; --nav:#FFFFFFF2; --shadow:0 1px 3px rgba(20,40,35,.08),0 4px 14px rgba(20,40,35,.06);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0E1815; --card:#152420; --card2:#1B2C27; --ink:#E7F0EC; --mut:#8FA69E;
    --line:#253832; --acc:#41B3A3; --acc-soft:#173832; --acc-ink:#7BD4C6;
    --amber:#E09A48; --amber-soft:#3A2C17; --red:#E0705F; --red-soft:#3D211D;
    --green:#5CB985; --green-soft:#1B3325; --nav:#152420F2; --shadow:0 1px 3px rgba(0,0,0,.4);
  }
}
:root[data-theme="light"]{
  --bg:#EFF4F2; --card:#FFFFFF; --card2:#F7FAF9; --ink:#1B2E29; --mut:#5E736D;
  --line:#D9E3DF; --acc:#177E74; --acc-soft:#DCEEEB; --acc-ink:#0E5A52;
  --amber:#B96F1E; --amber-soft:#F6E8D5; --red:#C24438; --red-soft:#F7E3E0;
  --green:#2E7D4F; --green-soft:#DFEEE4; --nav:#FFFFFFF2; --shadow:0 1px 3px rgba(20,40,35,.08),0 4px 14px rgba(20,40,35,.06);
}
:root[data-theme="dark"]{
  --bg:#0E1815; --card:#152420; --card2:#1B2C27; --ink:#E7F0EC; --mut:#8FA69E;
  --line:#253832; --acc:#41B3A3; --acc-soft:#173832; --acc-ink:#7BD4C6;
  --amber:#E09A48; --amber-soft:#3A2C17; --red:#E0705F; --red-soft:#3D211D;
  --green:#5CB985; --green-soft:#1B3325; --nav:#152420F2; --shadow:0 1px 3px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;
  font-size:15px; line-height:1.65;
  -webkit-tap-highlight-color:transparent;
}
#app{max-width:560px;margin:0 auto;padding:0 14px calc(84px + env(safe-area-inset-bottom));}
a{color:var(--acc);text-decoration:none}
button{font:inherit;color:inherit;background:none;border:none;padding:0;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:6px}
.small{font-size:12.5px;color:var(--mut)}
.num{font-variant-numeric:tabular-nums}

/* ── header ── */
header.top{
  position:sticky;top:0;z-index:30;background:var(--bg);
  padding:calc(10px + env(safe-area-inset-top)) 2px 8px;
  display:flex;align-items:baseline;gap:10px;border-bottom:1px solid var(--line);
}
.brand{font-weight:800;font-size:17px;letter-spacing:.14em}
.brand b{color:var(--acc)}
.brand-sub{font-size:11.5px;color:var(--mut);letter-spacing:.08em}
header.top .sp{flex:1}
#themeBtn{font-size:16px;line-height:1;padding:4px}

/* ── tabs ── */
nav.tabbar{
  position:fixed;left:0;right:0;bottom:0;z-index:40;
  background:var(--nav);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border-top:1px solid var(--line);
  display:flex;justify-content:center;
  padding-bottom:env(safe-area-inset-bottom);
}
nav.tabbar .wrap{display:flex;width:100%;max-width:560px}
.tabbtn{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;
  padding:9px 0 7px;color:var(--mut);font-size:11px;letter-spacing:.05em;
}
.tabbtn svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabbtn.on{color:var(--acc)}
.tabbtn.on svg{stroke-width:2.2}

.page{display:none;animation:fadein .18s ease}
.page.on{display:block}
@keyframes fadein{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){.page{animation:none}}

h2.sec{font-size:13px;letter-spacing:.18em;color:var(--mut);font-weight:700;margin:22px 2px 10px;text-transform:uppercase}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:14px 16px;margin-bottom:10px}
.card.tight{padding:11px 14px}

/* chips & pills */
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:600;border-radius:999px;padding:2px 9px;white-space:nowrap}
.pill.acc{background:var(--acc-soft);color:var(--acc-ink)}
.pill.amber{background:var(--amber-soft);color:var(--amber)}
.pill.red{background:var(--red-soft);color:var(--red)}
.pill.green{background:var(--green-soft);color:var(--green)}
.pill.mut{background:var(--card2);color:var(--mut);border:1px solid var(--line)}

/* ── home ── */
.hero{
  margin-top:14px;border-radius:16px;padding:20px 18px;color:#fff;
  background:linear-gradient(150deg,#0E5A52 0%,#177E74 55%,#2E9E8F 100%);
  box-shadow:var(--shadow);position:relative;overflow:hidden;
}
.hero::after{
  content:"";position:absolute;right:-30px;bottom:-42px;width:220px;height:150px;
  background:
    linear-gradient(115deg,transparent 46%,rgba(255,255,255,.13) 46.5%,rgba(255,255,255,.13) 53%,transparent 53.5%),
    linear-gradient(245deg,transparent 46%,rgba(255,255,255,.10) 46.5%,rgba(255,255,255,.10) 55%,transparent 55.5%);
  transform:rotate(-4deg);
}
.hero .eyebrow{font-size:11px;letter-spacing:.22em;opacity:.85;margin-bottom:4px}
.hero .big{font-size:30px;font-weight:800;line-height:1.2;letter-spacing:.02em}
.hero .sub{font-size:13px;opacity:.9;margin-top:6px}
.clockrow{display:flex;gap:8px;margin-top:12px}
.clock{flex:1;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 4px;text-align:center;box-shadow:var(--shadow)}
.clock .tz{font-size:10.5px;letter-spacing:.12em;color:var(--mut)}
.clock .t{font-size:19px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:.03em}
.clock .d{font-size:10.5px;color:var(--mut);font-variant-numeric:tabular-nums}
.alert{display:flex;gap:10px;align-items:flex-start;border-left:3px solid var(--amber);background:var(--amber-soft);border-radius:10px;padding:10px 12px;margin-bottom:8px;font-size:13.5px}
.alert.red{border-left-color:var(--red);background:var(--red-soft)}
.alert b{display:block}

/* ── itinerary ── */
.day{display:flex;gap:0;margin-bottom:10px}
.dcard{flex:1;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.dhead{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;text-align:left}
.dnum{
  min-width:46px;height:46px;border-radius:11px;background:var(--acc-soft);color:var(--acc-ink);
  display:flex;flex-direction:column;align-items:center;justify-content:center;flex-shrink:0;
}
.dnum .n{font-size:16px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.dnum .dt{font-size:10px;font-variant-numeric:tabular-nums;opacity:.85}
.day.today .dnum{background:var(--acc);color:#fff}
.dtitle{flex:1;min-width:0}
.dtitle .t{font-weight:700;font-size:14.5px;line-height:1.4}
.dtitle .meta{font-size:11.5px;color:var(--mut);display:flex;gap:8px;flex-wrap:wrap;margin-top:2px}
.chev{color:var(--mut);transition:transform .18s;flex-shrink:0}
.day.open .chev{transform:rotate(90deg)}
.dbody{display:none;border-top:1px solid var(--line);padding:12px 14px;background:var(--card2)}
.day.open .dbody{display:block}
.dbody .route{font-size:13.5px;white-space:pre-line}
.kv{display:grid;grid-template-columns:64px 1fr;gap:4px 10px;font-size:13px;margin-top:10px}
.kv dt{color:var(--mut)}
.kv dd{margin:0}
.notebox{margin-top:10px;font-size:12.5px;background:var(--amber-soft);color:inherit;border-radius:9px;padding:8px 10px}
.notebox p{margin:0 0 4px}.notebox p:last-child{margin:0}
.tl{margin-top:12px;border-top:1px dashed var(--line);padding-top:10px}
.tl h4{margin:0 0 8px;font-size:12px;letter-spacing:.12em;color:var(--mut)}
.tlrow{display:flex;gap:10px;padding:5px 0;font-size:13px;border-bottom:1px solid var(--line)}
.tlrow:last-child{border-bottom:none}
.tlrow .tm{min-width:82px;color:var(--acc-ink);font-weight:600;font-variant-numeric:tabular-nums;font-size:12.5px;flex-shrink:0}
.tlrow .grp{font-size:11px;margin-right:2px}
.tlrow .what b{font-weight:700}
.tlrow .rem{display:block;font-size:12px;color:var(--mut)}
.grpfilter{display:flex;gap:6px;margin:4px 0 8px}
.maplink{font-size:12.5px;font-weight:600}

/* ── bookings ── */
.bk{display:flex;align-items:center;gap:10px;padding:11px 2px;border-bottom:1px solid var(--line)}
.bk:last-child{border-bottom:none}
.bk .info{flex:1;min-width:0}
.bk .cat{font-size:10.5px;letter-spacing:.1em;color:var(--mut)}
.bk .nm{font-weight:700;font-size:13.5px;line-height:1.35}
.bk .note{font-size:12px;color:var(--mut)}
.codebtn{
  flex-shrink:0;font-variant-numeric:tabular-nums;font-size:12.5px;font-weight:700;
  background:var(--acc-soft);color:var(--acc-ink);border-radius:8px;padding:6px 10px;
  max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.codebtn.pending{background:var(--amber-soft);color:var(--amber)}
.search{
  width:100%;background:var(--card);border:1px solid var(--line);border-radius:11px;
  padding:10px 14px;font:inherit;color:var(--ink);margin:14px 0 4px;
}
.search::placeholder{color:var(--mut)}

/* ── todo ── */
.prog{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:14px 16px;margin-top:14px}
.progbar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:8px}
.progbar i{display:block;height:100%;background:var(--acc);border-radius:99px;transition:width .3s}
.todo{display:flex;gap:11px;align-items:flex-start;padding:10px 2px;border-bottom:1px solid var(--line)}
.todo:last-child{border-bottom:none}
.todo input{width:19px;height:19px;margin-top:2px;accent-color:var(--acc);flex-shrink:0}
.todo .tx{flex:1;font-size:13.5px}
.todo .tcat{font-size:11px;color:var(--mut)}
.todo.done .tx{color:var(--mut);text-decoration:line-through}

/* ── more ── */
.acc-item{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);margin-bottom:10px;overflow:hidden}
.acc-head{width:100%;display:flex;align-items:center;gap:12px;padding:13px 15px;text-align:left;font-weight:700;font-size:14.5px}
.acc-head .ic{width:34px;height:34px;border-radius:9px;background:var(--acc-soft);color:var(--acc-ink);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.acc-head .ic svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.acc-head .sub{display:block;font-size:11.5px;color:var(--mut);font-weight:400}
.acc-body{display:none;border-top:1px solid var(--line);padding:13px 15px;background:var(--card2);font-size:13.5px}
.acc-item.open .acc-body{display:block}
.acc-item.open .acc-head .chev{transform:rotate(90deg)}
table.tb{width:100%;border-collapse:collapse;font-size:12.5px}
table.tb th{text-align:left;color:var(--mut);font-weight:600;padding:5px 8px 5px 0;border-bottom:1px solid var(--line);white-space:nowrap}
table.tb td{padding:6px 8px 6px 0;border-bottom:1px solid var(--line);vertical-align:top}
table.tb tr:last-child td{border-bottom:none}
.tscroll{overflow-x:auto}
.trailcard{border-bottom:1px solid var(--line);padding:10px 0}
.trailcard:last-child{border-bottom:none}
.trailcard .tt{font-weight:700;font-size:13.5px}
.trailcard .tm2{font-size:12px;color:var(--mut);margin-top:2px}
.filterrow{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 10px}
.fbtn{font-size:12px;font-weight:600;border:1px solid var(--line);border-radius:999px;padding:4px 12px;color:var(--mut);background:var(--card)}
.fbtn.on{background:var(--acc);border-color:var(--acc);color:#fff}
.tel{font-weight:700;font-variant-numeric:tabular-nums}
.footer{margin:26px 4px 8px;text-align:center;font-size:11.5px;color:var(--mut);letter-spacing:.06em}

#toast{
  position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(8px);
  background:var(--ink);color:var(--bg);font-size:13px;font-weight:600;border-radius:99px;padding:8px 18px;
  opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:50;white-space:nowrap;
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>

/* ===================== 工具 ===================== */
const $=s=>document.querySelector(s), $$=s=>document.querySelectorAll(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function toast(msg){const t=$("#toast");t.textContent=msg;t.classList.add("show");clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove("show"),1600);}
function copyText(txt){
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(()=>toast("已複製："+txt),()=>toast(txt));}
  else{toast(txt);}
}
function mapUrl(q){return "https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(q);}
function fmt2(n){return String(n).padStart(2,"0");}
function tzParts(tz){
  try{
    const p=new Intl.DateTimeFormat("zh-TW",{timeZone:tz,hour12:false,hour:"2-digit",minute:"2-digit",month:"numeric",day:"numeric",weekday:"short"}).formatToParts(new Date());
    const g=t=>{const x=p.find(v=>v.type===t);return x?x.value:"";};
    return {t:g("hour")+":"+g("minute"),d:g("month")+"/"+g("day")+" "+g("weekday")};
  }catch(e){return {t:"--:--",d:""};}
}
function tripDayNum(){
  const now=new Date();
  const y=now.getFullYear(),m=now.getMonth()+1,dd=now.getDate();
  const cur=new Date(y,m-1,dd);
  const s=new Date(2026,7,1), e=new Date(2026,7,18);
  if(cur<s) return {phase:"before",days:Math.round((s-cur)/86400000)};
  if(cur>e) return {phase:"after"};
  return {phase:"during",d:Math.round((cur-s)/86400000)+1};
}

        <button class="fbtn on" data-g="all">全部</button>

      tl.map(r=>`<div class="tlrow" data-grp="${r[1]}"><span class="tm num">${esc(r[0])}</span>

  return `<div class="day ${open?"open":""} ${isToday?"today":""}" id="day${day.d}">
    <div class="dcard">
      <button class="dhead" data-day="${day.d}" aria-expanded="${open?"true":"false"}">
        <span class="dnum"><span class="n">D${day.d}</span><span class="dt">${day.date} ${day.dow}</span></span>
        <span class="dtitle"><span class="t">${esc(day.title)}</span>

          <dt>步道</dt><dd>${esc(day.trail)}</dd>

/* ===================== 待辦 ===================== */
const LS_KEY="sejz-todo-v1";
function loadDone(){try{return JSON.parse(localStorage.getItem(LS_KEY)||"{}");}catch(e){return {};}}
function saveDone(o){try{localStorage.setItem(LS_KEY,JSON.stringify(o));}catch(e){}}
function renderTodo(){
  const done=loadDone();
  const order=["red","orange","yellow","green","white","done"];
  const grp={};
  TODOS.forEach(t=>{(grp[t.p]=grp[t.p]||[]).push(t);});
  const activeTotal=TODOS.filter(t=>t.p!=="done").length;
  const doneCnt=TODOS.filter(t=>t.p!=="done"&&done[t.id]).length;
  const pct=activeTotal?Math.round(doneCnt/activeTotal*100):0;
  $("#pg-todo").innerHTML=
    `<div class="prog"><b>出發前進度</b> <span class="num">${doneCnt} / ${activeTotal}</span>
      <span class="small">（勾選會存在這支手機上）</span>
      <div class="progbar"><i style="width:${pct}%"></i></div></div>`+
    order.filter(p=>grp[p]).map(p=>`<h2 class="sec">${PRIO[p][0]}</h2><div class="card tight">`+
      grp[p].map(t=>{
        const chk=t.p==="done"||!!done[t.id];
        return `<label class="todo ${chk?"done":""}">
          <input type="checkbox" data-id="${t.id}" ${chk?"checked":""} ${t.p==="done"?"disabled":""}>
          <span class="tx">${esc(t.tx)}<span class="tcat"> · ${esc(t.cat)}</span></span></label>`;
      }).join("")+`</div>`).join("");
  $$("#pg-todo input[type=checkbox]").forEach(cb=>cb.addEventListener("change",e=>{
    const d=loadDone();
    if(e.target.checked)d[e.target.dataset.id]=1;else delete d[e.target.dataset.id];
    saveDone(d);renderTodo();
  }));
}

/* ===================== 導覽與事件 ===================== */
function showPage(pg){
  $$(".page").forEach(p=>p.classList.toggle("on",p.id==="pg-"+pg));
  $$(".tabbtn").forEach(b=>b.classList.toggle("on",b.dataset.pg===pg));
  try{history.replaceState(null,"","#"+pg);}catch(e){}
  window.scrollTo(0,0);
}
document.addEventListener("click",e=>{
  const tab=e.target.closest(".tabbtn");
  if(tab){showPage(tab.dataset.pg);return;}
  const dh=e.target.closest(".dhead");
  if(dh){const el=dh.closest(".day");el.classList.toggle("open");dh.setAttribute("aria-expanded",el.classList.contains("open"));return;}
  const ah=e.target.closest(".acc-head");
  if(ah){const el=ah.closest(".acc-item");el.classList.toggle("open");ah.setAttribute("aria-expanded",el.classList.contains("open"));return;}
  const cb=e.target.closest(".codebtn");
  if(cb){copyText(cb.dataset.code);return;}
  const gf=e.target.closest(".grpfilter .fbtn");
  if(gf){
    const wrap=gf.closest(".tl");
    wrap.querySelectorAll(".grpfilter .fbtn").forEach(b=>b.classList.toggle("on",b===gf));
    const g=gf.dataset.g;
    wrap.querySelectorAll(".tlrow").forEach(r=>{r.style.display=(g==="all"||r.dataset.grp==="全"||r.dataset.grp===g)?"":"none";});
    return;
  }
  const tf=e.target.closest("#trailFilter .fbtn");
  if(tf){
    const wrap=$("#acc-trail");
    wrap.querySelectorAll("#trailFilter .fbtn").forEach(b=>b.classList.toggle("on",b===tf));
    const lv=tf.dataset.lv;
    wrap.querySelectorAll(".trailcard[data-lv]").forEach(c=>{c.style.display=(lv==="all"||c.dataset.lv.includes(lv))?"":"none";});
    return;
  }
});
$("#themeBtn").addEventListener("click",()=>{
  const r=document.documentElement;
  const cur=r.getAttribute("data-theme");
  const sysDark=window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches;
  const next=(cur?cur==="dark":sysDark)?"light":"dark";
  r.setAttribute("data-theme",next);
  try{localStorage.setItem("sejz-theme",next);}catch(e){}
});
try{const t=localStorage.getItem("sejz-theme");if(t)document.documentElement.setAttribute("data-theme",t);}catch(e){}
